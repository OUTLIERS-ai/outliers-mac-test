name: Content engine on a Mac

# Walks the Session 8 content engine guide (Mac edition) end to end on 2 real Macs,
# from the public repo, with Python from python.org. Started by hand only.
# No secrets are used or needed. Nothing here logs in to anything.

on:
  workflow_dispatch:
    inputs:
      kit:
        description: "Repo to walk: outliers-content-engine or outliers-content-engine-mac"
        required: false
        default: "outliers-content-engine-mac"

permissions:
  contents: read

jobs:
  walk:
    name: content engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          path: _mactest
      - name: Walk the guide as a Mac member
        env:
          MAC_LABEL: ${{ matrix.os }}
          KIT: ${{ github.event.inputs.kit || 'outliers-content-engine-mac' }}
        run: bash _mactest/harness/content_engine_walk.sh "$RUNNER_TEMP/out"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.kit || 'outliers-content-engine-mac' }}--${{ matrix.os }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
